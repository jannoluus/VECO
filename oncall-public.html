<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>VECO Valve</title>
  <link rel="stylesheet" href="assets/css/oncall-public.css?v=RC1.005.9">

<body>
  <main class="public-oncall" aria-live="polite">
    <header class="public-oncall__header">
      <div class="public-oncall__brand" aria-label="VECO">VECO</div>
      <div class="public-oncall__page-title">VALVE</div>
    </header>

    <section class="public-oncall__hero">
      <div id="oncallStatus" class="public-oncall__status">Laen valveinfot…</div>
      <h1 id="oncallName" class="public-oncall__name">—</h1>
      <p id="oncallPeriod" class="public-oncall__period"></p>
      <p id="oncallPeriodDetail" class="public-oncall__period-detail"></p>
    </section>

    <section class="public-oncall__rotation" aria-labelledby="rotationTitle">
      <h2 id="rotationTitle">Rotatsioon</h2>
      <div id="rotationLine" class="rotation-line" role="list"></div>
      <p id="rotationNote" class="public-oncall__note"></p>

      <span class="public-oncall__refresh-icon" aria-hidden="true">↻</span>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
